[lms1]
url = http://127.0.0.1/moodle/
user = lms_explorer
service = moodle_mobile_app
autoconnect = 0
remember_me = 0

[application]
theme = system
font_family = Segoe UI
font_size = 9
default_width = 1400
default_height = 900
show_icons = 1
alternate_colors = 1

[logging]
level = INFO
file = logs/moodle_manager.log
max_size = 10485760
backup_count = 5
